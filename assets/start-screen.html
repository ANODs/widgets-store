<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{background:linear-gradient(135deg,#41C0F5,#1A8AD0);font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 22% 12%,rgba(255,255,255,.3),rgba(255,255,255,0) 60%)}
.left{position:absolute;left:44px;top:0;bottom:0;width:290px;display:flex;flex-direction:column;justify-content:center}
.grid{display:grid;grid-template-columns:38px 38px;gap:7px;margin-bottom:22px}
.grid i{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.4)}
.grid i.on{background:#fff;box-shadow:0 5px 12px rgba(11,79,126,.25)}
h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-1px}
p{margin:12px 0 0;font-size:17px;line-height:1.35;font-weight:500;opacity:.92}
.pill{margin-top:20px;align-self:flex-start;background:#fff;color:#1E96C8;font-weight:700;font-size:15px;padding:9px 18px;border-radius:30px;box-shadow:0 6px 16px rgba(11,79,126,.25)}
.card{position:absolute;left:352px;top:54px;width:264px;height:252px;background:#fff;border-radius:22px 22px 22px 6px;box-shadow:0 16px 36px rgba(11,79,126,.35)}
</style>
<div class="glow"></div>
<div class="left">
  <div class="grid"><i class="on"></i><i></i><i></i><i class="on"></i></div>
  <h1>Widgets<br>Store</h1>
  <p>Telegram widgets in one catalog</p>
  <div class="pill">Open the catalog</div>
</div>
<div class="card"></div>
